backend:
  name: git-gateway
  branch: main

media_folder: "images/press"
public_folder: "/images/press"

collections:
  - name: "press"
    label: "Press Releases"
    folder: "press"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "URL-friendly title (e.g., coalition-launches-autonomy)" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Short summary for press list (150 chars)" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Link", name: "link", widget: "string", required: false, hint: "Optional external link" }
    editor:
      preview: true
